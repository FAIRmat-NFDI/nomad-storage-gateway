name: Go CI

on:
  workflow_dispatch:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "config.yaml"
      - "e2e/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "config.yaml"
      - "e2e/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -cover ./...

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start storage services
        run: docker compose -f e2e/docker-compose.yaml up -d

      - name: Run end-to-end tests
        run: go test -tags=e2e -v ./e2e

      - name: Show storage service logs
        if: ${{ failure() }}
        run: docker compose -f e2e/docker-compose.yaml logs

      - name: Stop storage services
        if: ${{ always() }}
        run: docker compose -f e2e/docker-compose.yaml down -v --remove-orphans
