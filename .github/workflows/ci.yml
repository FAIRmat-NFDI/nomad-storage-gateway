name: Go CI

on:
  workflow_dispatch:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "config.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - "e2e/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "config.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - "e2e/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -cover ./...

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start storage services
        run: docker compose -f e2e/docker-compose.yaml up -d

      - name: Run end-to-end tests
        run: go test -tags=e2e -v ./e2e

      - name: Show storage service logs
        if: ${{ failure() }}
        run: docker compose -f e2e/docker-compose.yaml logs

      - name: Stop storage services
        if: ${{ always() }}
        run: docker compose -f e2e/docker-compose.yaml down -v --remove-orphans

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: seaweedfs-storage-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
